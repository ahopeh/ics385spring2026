<!DOCTYPE html>

<!-- sets page language and title-->
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8" />
    <title>F2C Converter</title>
</head>

<body>
    <!--main header that appears on the page-->
    <h1>Farenheit to Centigrade Temperature Converter</h1>

    <!--this section handles how different input areas/buttons
           send input data to the server-->
    <form action="/f2c" method="post">
        <input type="text" name="fahrenheit" placeholder="Fahrenheit" />
        <button type="submit">Convert Temperature</button>
        <output type="text" name="result" placeholder="Result"></output>
    </form>
</body>

</html>
